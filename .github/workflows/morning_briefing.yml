name: Morning Briefing

on:
  # 00:00 UTC = 07:00 WIB (Western Indonesia Time, UTC+7)
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from the Actions tab at any time
  workflow_dispatch:

permissions:
  contents: write   # needed to commit and push data.js

jobs:
  briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies ───────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            anthropic \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            requests \
            beautifulsoup4 \
            python-dotenv \
            aiohttp

      # ── 4. Google credentials ─────────────────────────────────────────────────
      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_PICKLE: ${{ secrets.GOOGLE_TOKEN_PICKLE }}
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" | base64 --decode > credentials.json
          echo "$GOOGLE_TOKEN_PICKLE" | base64 --decode > token.pickle

      # ── 5. Debug paths ────────────────────────────────────────────────────────
      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la tools
          find . -maxdepth 3 -type f | sort

      # ── 6. Run the briefing script ────────────────────────────────────────────
      - name: Run morning briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python3 tools/market_briefing.py

      # ── 7. Commit and push data.js ────────────────────────────────────────────
      - name: Commit updated data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet \
            && echo "data.js unchanged — nothing to commit." \
            || git commit -m "chore: update briefing data $(date -u +%Y-%m-%d)"

      - name: Push to GitHub
        run: git push
